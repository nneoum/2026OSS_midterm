<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캠퍼스 분실물 관리</title>
  <!-- Bootstrap CSS CDN: 시험에서 수정하지 않음 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="app.js" defer></script>
</head>

<body>
  <main class="container py-4">
    <header class="form-label">
      <h1>캠퍼스 분실물 관리</h1>
      <p id="summary">등록된 분실물 목록</p>
    </header>

    <!-- TODO Q2: 아래 등록 영역의 기존 마크업에 Bootstrap 클래스를 적용 -->

    <section id="registration" class="panel mb-4">
      <h2 class="h5">분실물 등록</h2>
      <form id="itemForm">
        <div class="mb-3">
          <label for="itemName" >물품명</label>
          <input class="form-control" id="itemName" name="itemName" type="text" minlength="2" required>
        </div>
        <!-- TODO Q3-A: 장소(select)와 습득일(date) Form 필드 추가 -->
        <div class="mb-3">
          <select id="select" name="place" required>
            <option value="">장소선택</option>
            <optgroup label="장소">
              <option value="library">도서관</option>
              <option value="stud">학생회관</option>
              <option value="class">강의실</option>
            </optgroup>
          </select>

          <label for="date"> 습득일 </label>
          <input type="date" id="date" name="date" required>

          <button class="btn btn-primary" type="submit">등록</button>
        </div>


      </form>
      <p id="message" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <h2 class="h5 m-0">분실물 목록</h2>
        <!-- TODO Q5-A: 검색 입력 필드 추가 -->
      </div>
      <div class="table-responsive">
        <table id="itemTable">
          <thead>
            <tr>
              <th>번호</th>
              <th>물품명</th>
              <th>장소</th>
              <th>습득일</th>
              <th>상태</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>

</html>
